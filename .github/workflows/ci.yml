name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  offline-tests:
    # 全量离线单测 — 无 API Key / 无外部服务 (与本地基线一致的用例集)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖 (锁定版本约束)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,rag]" -c requirements-lock.txt

      - name: 环境自检
        run: python auto_battery_research_cli.py --doctor || true

      - name: 离线单元测试
        run: python -m pytest -m "unit or not external" -q
