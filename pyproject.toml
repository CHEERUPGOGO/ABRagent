[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-battery-research"
version = "1.0.0"
description = "AutoBatteryResearch Agent (ABRAgent) — 全生命周期化学电池研究自动化智能体"
readme = "README.md"
authors = [{ name = "AutoBatteryResearch Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "openai>=1.0.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.2",
    # ReAct 主循环运行时 (langchain.agents.create_agent / langgraph create_react_agent)：
    # 属核心功能而非可选 extras —— 二者缺失时 backend 退化为裸 bind_tools 模型，
    # LLM 决策必失败 ([LLM-Notice] Invalid input type <class 'dict'>) 并降级确定性调度
    "langchain>=1.0.0",
    "langgraph>=1.0.0",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.7.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.optional-dependencies]
rag = [
    "langchain-chroma>=0.1.2",
    "langchain-ollama>=0.1.0",
    "chromadb>=0.5.0",
]
ui = [
    "textual>=0.50.0",
    "gradio>=4.0.0",
]
physics = [
    "pybamm>=23.5",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    # test_packaging 以 --no-build-isolation 离线构建 wheel，要求构建后端
    # 就位于测试环境本身 (≥75 自带原生 bdist_wheel)。Python 3.12+ 的 venv 与
    # 新版 GitHub runner 预装 Python 均不再捆绑 setuptools，缺它必抛
    # BackendUnavailable: Cannot import 'setuptools.build_meta'
    "setuptools>=75",
]
all = [
    "langchain-chroma>=0.1.2",
    "langchain-ollama>=0.1.0",
    "chromadb>=0.5.0",
    "textual>=0.50.0",
    "gradio>=4.0.0",
    "pybamm>=23.5; python_version < '3.13'",
]

[project.scripts]
abr-cli = "auto_battery_research.cli:main"
auto-battery-research = "auto_battery_research.cli:main"

[tool.setuptools.package-dir]
"" = "."
lmllm = "src/lmllm"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["auto_battery_research*", "miner*", "agent*", "preprocessing*", "pinn*", "lmllm*"]

[tool.setuptools.package-data]
# 运行时资源随包分发 —— 非 editable 安装的生命线:
#   setting.yaml / workflow/abr_workflow.yaml 被 StageManager 从安装目录直读,
#   缺失则阶段列表为空、CLI 不可用; doc/Guide_Doc 是 CurrentTips 引用的阶段
#   指南; tcss 是 TUI 样式。子目录无需 __init__.py, 模式相对包根匹配。
"auto_battery_research" = ["setting.yaml", "doc/Guide_Doc/*.md", "doc/templates/*.md"]
"auto_battery_research.workflow" = ["*.yaml"]
"auto_battery_research.tui" = ["styles/*.tcss"]
"auto_battery_research.web" = ["templates/*.html", "static/*.js"]
# RelationEngine 运行时数据 (alias_map/candidates/constraints + calibrated/seed/tasks
# 子目录) —— 其 _load 对缺失文件是静默降级(空表继续跑)，漏打包会让 C1-C8 硬
# 约束门禁在安装态沦为空校验，靠 test_packaging.py 在 zip 层面锁死回归。
"lmllm.RAG" = ["data/*.json", "data/*/*.json", "data/*/*.md"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["auto_battery_research/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: deterministic local unit tests",
    "integration: workflow and multi-stage integration tests",
    "external: tests requiring external live services (Ollama, live Chroma, external LLM APIs)",
    "slow: tests with long running times",
]
norecursedirs = [
    "output",
    "miner",
    "agent",
    "preprocessing",
    ".git",
    ".pytest_cache",
    "__pycache__",
]
