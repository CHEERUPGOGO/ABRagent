

version: "1.0.0"
agent_name: "AutoBatteryResearch Agent"
agent_abbr: "ABRAgent"

paths:
  workspace_root: "."
  papers_raw_dir: "papers/pdf"
  papers_doi_dir: "papers/pdf_doi"
  papers_markdown_dir: "papers/markdown"
  papers_merged_dir: "papers/merged"
  database_type_dir: "database/type"
  database_battery_type_dir: "database/battery_type"
  miner_json_dir: "miner/json"
  metadata_file: "miner/json/metadata/meta_merged.json"
  chroma_dir: "miner/chroma/paragraphs_q"
  chroma_collection: "battery_paragraphs_q"
  rag_data_dir: "src/lmllm/RAG/data"
  pinn_dir: "pinn"
  pinn_tools_dir: "src/lmllm/RAG/pinn_tools"
  output_dir: "output/auto_battery_research"
  journal_file: "output/auto_battery_research/abr_agent_journal.json"
  final_report_file: "output/auto_battery_research/final_research_report.md"

# 通用 OpenAI 兼容大模型接口配置 (支持 OpenAI / DeepSeek / Qwen / MiniMax / Claude 等)
openai:
  model_name: "$(OPENAI_MODEL: MiniMax-M2.7-highspeed)"
  openai_api_base: "$(OPENAI_API_BASE: https://api.minimaxi.com/v1)"
  openai_api_key: "$(OPENAI_API_KEY:)"

llm:
  backend: "openai"
  model: "$(OPENAI_MODEL: MiniMax-M2.7-highspeed)"
  base_url: "$(OPENAI_API_BASE: https://api.minimaxi.com/v1)"
  api_key: "$(OPENAI_API_KEY:)"
  planner_model: "$(OPENAI_MODEL: MiniMax-M2.7-highspeed)"
  extraction_model: "$(OPENAI_MODEL: MiniMax-M2.7-highspeed)"
  writer_model: "$(OPENAI_MODEL: MiniMax-M2.7-highspeed)"
  reviewer_model: "$(OPENAI_MODEL: MiniMax-M2.7-highspeed)"
  checker_model: "$(OPENAI_MODEL: MiniMax-M2.7-highspeed)"
  temperature: 0.1
  max_tokens: 16384
  output_max_tokens: 32768  # RAG 空白/截断输出最多重试一次，预算上限
  request_timeout: 120
  # ReAct 循环递归深度上限 (每轮工具调用约耗 2 个 super-step，25 支持完整多轮工具编排)
  recursion_limit: 25

embedding:
  model: "$(EMBEDDING_MODEL: qwen3-embedding:8b)"
  ollama_base_url: "$(OLLAMA_BASE_URL: http://localhost:11434)"

runtime_options:
  # Stage 5 (PINN) 默认启用: SPM PINN 模型已接入 (pinn/models/)，方案体系匹配
  # 注册表即执行放电仿真；未匹配体系回退参数提取-only。--skip-stage 5 可手动跳过。
  skip_pinn_default: false
  enable_llm_checker: true
  strict_mode: true
  max_retries_per_stage: 3
  # LLM 全量轨迹记录 (opt-in, 默认关): 开启后完整保留每次 LLM 调用的输入/输出/token/耗时
  # 与提示组装过程, 按行写入课题目录 llm_trace/trace_<会话>.jsonl。开启方式优先级:
  # abr-cli --trace > 本开关 > 环境变量 LLM_TRACE (覆盖 MCP/TUI 等无 CLI 进程)。
  # 轨迹含完整提示词 (可能含文献证据全文), 仅建议在本地调试/审计场景开启。
  llm_trace: false
  # Stage 5 反馈回路: 几何修订轮数预算 (ReviseGeometry 工具) 与达标判定容差。
  # 目标能量从课题文本提取 (如 "设计400Wh/kg..." → 400)；能量 ≥ 目标×(1-容差)
  # 即视为达标，LLM 停止修订；收尾仍未达标时自动择优回滚至能量最高一轮。
  max_geometry_revisions: 3
  target_energy_tolerance_pct: 5
  # Stage 6 第五部分实验方案: 由大模型综合完整方案/证据/仿真生成 (验收引用与参数一致性)。
  # 关闭或 LLM 不可用时回退为确定性实验章节渲染。
  experiment_plan_llm: true
  save_step_artifacts: true
  mcp_server:
    host: "127.0.0.1"
    port: 5005
    timeout: 300

# Stage 5 PINN 触发配置
# enabled = PINN 仿真总开关 (kill-switch)：关闭时无论体系是否匹配都只做参数提取。
# 触发判定 = enabled AND (cathode, anode) 匹配 pinn/models/registry.json 体系；
# rule 字段预留结构化阈值规则 (材料白名单 + 性能要求)，待 PINN 模块后续扩展。
pinn_trigger:
  enabled: true
  rule: null
